[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    # A cartesian-product warning almost always means a wrong aggregate, so it
    # should fail the build rather than scroll past.
    error::sqlalchemy.exc.SAWarning
    ignore::DeprecationWarning

# `--cov` is opt-in rather than always on: it slows every run by ~20% and the
# figure only matters when someone is actually looking at it.
